name: Blog data

on:
  schedule:
    # Every day at 0:30 JST
    - cron: "30 0 * * *"
      timezone: "Asia/Tokyo"
  workflow_dispatch:

permissions: {}

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.UPDATER_APP_CLIENT_ID }}
          private-key: ${{ secrets.UPDATER_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install_args: node
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: .updater/package.json
      - run: pnpm install
        working-directory: .updater
      - name: Calculate date to update
        id: date
        run: echo "date=$(TZ=Asia/Tokyo date -d yesterday +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - run: pnpm run update:blogs "$UPDATE_DATE"
        working-directory: .updater
        env:
          UPDATE_DATE: ${{ steps.date.outputs.date }}
      - name: Get GitHub App bot user ID
        id: updater-app-user-id
        run: echo "id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
      - name: Commit changes
        run: |
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "$UPDATER_APP_USER_ID+${APP_SLUG}[bot]@users.noreply.github.com"
          git add data/hinata/blogs data/nogi/blogs data/sakura/blogs
          git diff --staged --quiet || git commit -m "data: Update blog data for $UPDATE_DATE"
          git push
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          UPDATER_APP_USER_ID: ${{ steps.updater-app-user-id.outputs.id }}
          UPDATE_DATE: ${{ steps.date.outputs.date }}

  # Independent of update-data: re-fetches the same date's posts itself to get their URLs
  # (not stored in the committed JSON) and submits them to the Wayback Machine. Runs on the
  # same schedule but isn't ordered relative to update-data — it neither reads nor writes data/.
  archive:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install_args: node
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: .updater/package.json
      - run: pnpm install
        working-directory: .updater
      - name: Calculate date to archive
        id: date
        run: echo "date=$(TZ=Asia/Tokyo date -d yesterday +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - run: pnpm run archive:blogs "$ARCHIVE_DATE"
        working-directory: .updater
        env:
          ARCHIVE_DATE: ${{ steps.date.outputs.date }}
          INTERNET_ARCHIVE_ACCESS_KEY: ${{ secrets.INTERNET_ARCHIVE_ACCESS_KEY }}
          INTERNET_ARCHIVE_SECRET_KEY: ${{ secrets.INTERNET_ARCHIVE_SECRET_KEY }}
