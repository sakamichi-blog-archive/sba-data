name: Blog data

on:
  schedule:
    # Every day at 0:30 JST
    - cron: "30 0 * * *"
      timezone: "Asia/Tokyo"
  workflow_dispatch:

permissions: {}

# The Save Page Now session limit is per account, so archive legs must not overlap across runs
# either — the matrix's max-parallel only serialises legs within a single run, and a manual
# dispatch can otherwise start alongside the scheduled one. Serialising whole runs also keeps two
# update-data jobs from racing to push commits. Queue rather than cancel: an in-flight run holds
# capture sessions that a cancellation would strand.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.UPDATER_APP_CLIENT_ID }}
          private-key: ${{ secrets.UPDATER_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install_args: node
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: .updater/package.json
      - run: pnpm install
        working-directory: .updater
      - name: Calculate date range to update
        id: dates
        run: |
          echo "from=$(TZ=Asia/Tokyo date -d '3 days ago' +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "to=$(TZ=Asia/Tokyo date -d yesterday +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Update blog data for the last 3 days
        working-directory: .updater
        run: |
          for offset in 3 2 1; do
            date="$(TZ=Asia/Tokyo date -d "$offset days ago" +%Y-%m-%d)"
            echo "::group::Updating blogs for $date"
            pnpm run update:blogs "$date"
            echo "::endgroup::"
          done
      - name: Get GitHub App bot user ID
        id: updater-app-user-id
        run: echo "id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
      - name: Commit changes
        run: |
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "$UPDATER_APP_USER_ID+${APP_SLUG}[bot]@users.noreply.github.com"
          git add data/hinata/blogs data/nogi/blogs data/sakura/blogs
          git diff --staged --quiet || git commit -m "data: Update blog data for $UPDATE_FROM to $UPDATE_TO"
          git push
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          UPDATE_FROM: ${{ steps.dates.outputs.from }}
          UPDATE_TO: ${{ steps.dates.outputs.to }}
          UPDATER_APP_USER_ID: ${{ steps.updater-app-user-id.outputs.id }}

  # Independent of update-data: re-fetches the same date's posts itself to get their URLs
  # (not stored in the committed JSON) and submits them to the Wayback Machine. Runs on the
  # same schedule but isn't ordered relative to update-data — it neither reads nor writes data/.
  #
  # Covers yesterday only, unlike update-data's 3-day window. Save Page Now captures are
  # submitted one at a time and waited on, so runtime scales with post count: a 3-day window
  # peaks at ~109 posts (New Year), which can exceed the 6h job limit if captures are slow.
  # A single day peaks at ~68. Backfilled posts that update-data picks up on a later day are
  # therefore not archived.
  #
  # Split per group so one group's slow or failing captures can't eat the others' budget, and
  # so each leg gets its own 6h job limit (worst single group-day is ~35 posts). max-parallel
  # is 1 because the SPN session limit is per account, not per job — legs must never overlap.
  archive:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        group: [nogi, hinata, sakura]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install_args: node
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: .updater/package.json
      - run: pnpm install
        working-directory: .updater
      - name: Archive yesterday's blogs
        working-directory: .updater
        run: |
          pnpm run archive:blogs "$(TZ=Asia/Tokyo date -d yesterday +%Y-%m-%d)" \
            --group="$GROUP"
        env:
          GROUP: ${{ matrix.group }}
          INTERNET_ARCHIVE_ACCESS_KEY: ${{ secrets.INTERNET_ARCHIVE_ACCESS_KEY }}
          INTERNET_ARCHIVE_SECRET_KEY: ${{ secrets.INTERNET_ARCHIVE_SECRET_KEY }}
