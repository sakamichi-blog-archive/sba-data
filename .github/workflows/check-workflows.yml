name: Check workflows

on:
  pull_request:
    branches: [main]
    paths:
      - .github/**
      - mise.lock
      - mise.toml

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: actionlint pinact shellcheck zizmor
      - run: actionlint
      - run: zizmor --format github .github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: mise run pinact:check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
