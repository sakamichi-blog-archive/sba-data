name: Update schedule data

on:
  schedule:
    # Every 6 hours (0:00, 6:00, 12:00, 18:00 JST) — schedule events get announced and
    # revised throughout the day, unlike blog posts. 0:00 stays clear of the blogs
    # workflow's 0:30 JST run.
    - cron: "0 */6 * * *"
      timezone: "Asia/Tokyo"

permissions: {}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.UPDATER_APP_CLIENT_ID }}
          private-key: ${{ secrets.UPDATER_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install_args: node
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: .updater/package.json
      - run: pnpm install
        working-directory: .updater
      - name: Calculate today's date
        id: date
        run: echo "date=$(TZ=Asia/Tokyo date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - run: pnpm run update:schedule
        working-directory: .updater
      - name: Get GitHub App bot user ID
        id: updater-app-user-id
        run: echo "id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
      - name: Commit changes
        run: |
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "$UPDATER_APP_USER_ID+${APP_SLUG}[bot]@users.noreply.github.com"
          git add data/hinata/schedule data/nogi/schedule data/sakura/schedule
          git diff --staged --quiet || git commit -m "data: Update schedule data for $UPDATE_DATE"
          git push
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          UPDATER_APP_USER_ID: ${{ steps.updater-app-user-id.outputs.id }}
          UPDATE_DATE: ${{ steps.date.outputs.date }}
