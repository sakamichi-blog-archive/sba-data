name: Update schedule data

on:
  schedule:
    # NOTE: Stay clear of the blogs workflow's 0:30 JST run
    - cron: 0 */6 * * *
      timezone: Asia/Tokyo

permissions: {}

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.UPDATER_APP_CLIENT_ID }}
          permission-contents: write
          private-key: ${{ secrets.UPDATER_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          token: ${{ steps.app-token.outputs.token }}
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install_args: node
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: .updater/package.json
      - run: pnpm install
        working-directory: .updater
      - name: Calculate update timestamp
        id: timestamp
        run: echo "timestamp=$(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M')" >> "$GITHUB_OUTPUT"
      - run: pnpm run update:schedule
        working-directory: .updater
      - name: Get GitHub App bot user ID
        id: updater-app-user-id
        run: echo "id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
      - name: Commit changes
        run: |
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "$UPDATER_APP_USER_ID+${APP_SLUG}[bot]@users.noreply.github.com"
          git add data/hinata/schedule data/nogi/schedule data/sakura/schedule
          git diff --staged --quiet || git commit -m "data: Update schedule data (${UPDATE_TIMESTAMP} JST)"
          git push
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          UPDATE_TIMESTAMP: ${{ steps.timestamp.outputs.timestamp }}
          UPDATER_APP_USER_ID: ${{ steps.updater-app-user-id.outputs.id }}

  publish-calendars:
    needs: update-data
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install_args: node
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: .updater/package.json
      - run: pnpm install
        working-directory: .updater
      - run: pnpm run build:calendars
        working-directory: .updater
      - name: Publish calendars to R2
        run: |
          aws s3 sync .updater/dist/calendars "s3://sakamichi-blog-archive-calendars-production" \
            --endpoint-url "https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
