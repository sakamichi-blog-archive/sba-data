name: Update blog data

on:
  schedule:
    - cron: '30 15 * * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: .updater/package.json
      - run: pnpm install
        working-directory: .updater
      - run: pnpm run update
        working-directory: .updater
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        id: cpr
        with:
          commit-message: 'data: Update blog data'
          committer: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          author: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          branch: data-update
          delete-branch: true
          title: 'data: Update blog data'
          add-paths: |
            hinata-blogs
            nogi-blogs
            sakura-blogs
      - if: steps.cpr.outputs.pull-request-number
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.PR_APPROVER_APP_ID }}
          private-key: ${{ secrets.PR_APPROVER_APP_PRIVATE_KEY }}
      - if: steps.cpr.outputs.pull-request-number
        run: gh pr review "$PR_NUMBER" --approve
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
      - if: steps.cpr.outputs.pull-request-number
        run: gh pr merge "$PR_NUMBER" --auto --squash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
