name: Update blog data

on:
  schedule:
    - cron: '30 15 * * *'

permissions: {}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.UPDATER_APP_CLIENT_ID }}
          private-key: ${{ secrets.UPDATER_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true
      - uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: .updater/package.json
      - run: pnpm install
        working-directory: .updater
      - run: pnpm run update
        working-directory: .updater
      - name: Get GitHub App bot user ID
        id: bot-user-id
        run: echo "id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
      - name: Commit changes
        run: |
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "$BOT_USER_ID+${APP_SLUG}[bot]@users.noreply.github.com"
          git add hinata-blogs nogi-blogs sakura-blogs
          git diff --staged --quiet || git commit -m "data: Update blog data"
          git push
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          BOT_USER_ID: ${{ steps.bot-user-id.outputs.id }}
