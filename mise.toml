[settings]
auto_install = false
lockfile = true
minimum_release_age = "3d"
pin = true

[tools]
actionlint = "1"
node = "24"
pinact = "4"
shellcheck = "0.11" # Used via actionlint
zizmor = "1"

[tasks."check:workflows"]
description = "Check GitHub Actions workflows"
run = ["actionlint", "zizmor .github", "mise run pinact:check"]

[tasks."pinact:check"]
description = "Check GitHub Actions are pinned to commit SHAs"
run = "pinact run --check --min-age 3"

[tasks."pinact:run"]
description = "Pin unpinned GitHub Actions to their commit SHAs"
run = "pinact run --min-age 3"

[tasks."pinact:update"]
description = "Update pinned GitHub Actions to their latest commit SHAs"
run = "pinact run --update --min-age 3"
