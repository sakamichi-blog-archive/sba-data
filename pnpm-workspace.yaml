packages:
  - .updater
  - .web

allowBuilds:
  "@parcel/watcher": true
  esbuild: false
  workerd: false
blockExoticSubdeps: true
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - "@sakamichi-blog-archive/utils@0.8.0"
trustPolicy: no-downgrade
trustPolicyExclude:
  - "chokidar@4.0.3"
  - "semver@6.3.1"
packageExtensions:
  # @astrojs/astro2tsx ships @emnapi/core 1.x but leaves @emnapi/runtime to its @napi-rs/wasm-runtime
  # peer, which picks up the 2.0 beta that rolldown 1.2.19 brings in; astro check crashes on the mismatch.
  "@astrojs/astro2tsx@0.1":
    dependencies:
      "@emnapi/runtime": "^1.11.3"
overrides:
  # cheerio 1.2.0 pins a vulnerable undici (GHSA advisories fixed in 7.30.1).
  "undici@>=7.0.0 <7.30.1": "^7.30.1"
  # @sakamichi-blog-archive/utils 0.10.0 pins a vulnerable zod (fixed in 4.6.6).
  "zod@>=4.0.0 <4.6.6": "^4.6.6"
